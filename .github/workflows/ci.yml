name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Syntax & Compilation Check
      run: |
        python -m py_compile src/frontend/app.py
        python -m py_compile src/frontend/auth.py
        python -m py_compile src/api_fetcher/fetcher.py
        python -m py_compile src/processor/alert_engine.py
        python -m py_compile src/database/auth_store.py
        python -m py_compile infrastructure/setup_aws_infrastructure.py

    - name: Execute Component Test Suites
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python src/api_fetcher/fetcher.py
        python src/processor/alert_engine.py

